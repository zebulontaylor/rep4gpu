[package]
name = "siv-silu-proof"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
bulletproofs = { version = "=5.0.0", features = ["yoloproofs"] }
curve25519-dalek = { version = "=4.1.3", features = ["rand_core"] }
merlin = "=3.0.0"
rand = "=0.8.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
anyhow = "1"
rayon = "=1.11.0"

[patch.crates-io]
bulletproofs = { path = "vendor/bulletproofs" }
