[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rep4gpu"
version = "0.1.0"
description = "Exact GPU ring kernels and a four-party Rep4 inference prototype"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.5", "triton>=3.1", "threadpoolctl>=3"]

[project.optional-dependencies]
crypto = ["cryptography>=45"]
test = ["pytest>=8", "blake3>=1.0"]

[tool.setuptools.packages.find]
include = ["rep4gpu*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
