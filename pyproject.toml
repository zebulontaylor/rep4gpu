[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rep4gpu"
version = "0.1.0"
description = "GPU-accelerated four-party Rep4 MPC for private neural network inference (ring Z/2^k and odd-prime CRT)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.5",
    "triton>=3.1",
    "blake3>=1.0",
]

[project.optional-dependencies]
crypto = ["cryptography>=45"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rep4gpu*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
